<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="820" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Patterns and Markers -->
    <pattern id="grid-pat" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#e2e8f0" stroke-width="0.75" stroke-dasharray="2,4"/>
    </pattern>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- MAP FRAME & BORDER -->
  <rect x="15" y="15" width="1170" height="790" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5" rx="4"/>
  <rect x="25" y="25" width="1150" height="770" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

  <!-- MAP CANVAS AREA -->
  <rect x="35" y="105" width="840" height="675" fill="#fdfbf7" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="35" y="105" width="840" height="675" fill="url(#grid-pat)"/>

  <!-- GANGA RIVER BASIN (PATNA WATERBODY BACKGROUND) -->
  <path d="M 35 140 C 180 135, 320 120, 500 130 C 650 140, 750 155, 875 160 L 875 105 L 35 105 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
  <text x="320" y="132" font-size="13" font-style="italic" font-weight="700" fill="#0369a1" letter-spacing="3px">GANGA RIVER (RIVERFRONT CORRIDOR)</text>

  <!-- STUDY AREA BOUNDARY -->
  <rect x="45" y="120" width="820" height="645" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8,6" rx="6"/>
  <text x="55" y="755" font-size="11" font-weight="700" fill="#475569" letter-spacing="1px">PATNA HIGHWAY CORRIDOR STUDY AREA BOUNDARY [~215 SQ KM]</text>

  <!-- ACCESSIBILITY ZONES (BACKGROUND TINT POLYGONS) -->
  <!-- Low Accessibility (Peripheral South/East) -->
  <rect x="50" y="600" width="810" height="160" fill="#fee2e2" opacity="0.6"/>
  <!-- Moderate Accessibility (Intermediate Feeder Belt) -->
  <rect x="50" y="440" width="810" height="160" fill="#fef3c7" opacity="0.55"/>
  <!-- High Accessibility (Highway & Arterial Core Corridor) -->
  <path d="M 50 150 L 860 170 L 860 440 L 50 440 Z" fill="#dcfce7" opacity="0.55"/>

  <!-- MULTI-RING BUFFERS AROUND HIGHWAYS (ILLUSTRATIVE REPRESENTATION) -->
  <!-- 2000m Buffer Envelope -->
  <path d="M 50 200 Q 420 220 860 210 L 860 480 Q 420 460 50 490 Z" fill="#dbeafe" opacity="0.4"/>
  <!-- 1000m Buffer Envelope -->
  <path d="M 50 240 Q 420 255 860 245 L 860 430 Q 420 415 50 440 Z" fill="#ffedd5" opacity="0.5"/>
  <!-- 500m Buffer Envelope -->
  <path d="M 50 270 Q 420 280 860 275 L 860 385 Q 420 375 50 395 Z" fill="#dcfce7" opacity="0.65"/>

  <!-- SECONDARY CONNECTORS & FEEDER ROADS -->
  <g stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,2" fill="none">
    <path d="M 120 720 L 150 480 L 220 330 L 260 170" />
    <path d="M 280 730 L 310 490 L 380 320 L 410 180" />
    <path d="M 460 730 L 480 500 L 540 330 L 580 180" />
    <path d="M 640 730 L 670 480 L 720 340 L 760 190" />
    <path d="M 60 520 L 840 510" />
  </g>

  <!-- PRIMARY ARTERIAL ROADS (BLUE) -->
  <g stroke="#2563eb" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Bailey Road / Jawaharlal Nehru Marg (West-East spine) -->
    <path d="M 60 320 Q 320 330 520 335 Q 720 340 850 335"/>
    <!-- Ashok Rajpath (Riverfront Arterial) -->
    <path d="M 80 180 Q 400 175 620 185 Q 760 195 850 205"/>
    <!-- Kankarbagh Main Road / Old Bypass -->
    <path d="M 180 430 Q 450 425 720 440 L 850 460"/>
    <!-- Radial Arterials -->
    <path d="M 380 180 L 390 335 L 420 425 L 450 630"/>
    <path d="M 600 185 L 610 335 L 640 435 L 680 630"/>
  </g>

  <!-- NATIONAL HIGHWAYS & EXPRESSWAYS (AMBER / GOLD) -->
  <g stroke="#d97706" stroke-width="5.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Loknayak Ganga Path (Patna Marine Drive Expressway) -->
    <path d="M 45 155 C 240 148, 480 145, 680 160 C 760 168, 810 175, 865 180"/>
    <!-- NH-30 / NH-31 Southern Bypass Corridor -->
    <path d="M 45 610 Q 380 595 580 590 Q 720 580 865 570"/>
    <!-- AIIMS - Digha Elevated Expressway Corridor -->
    <path d="M 160 158 L 175 320 L 195 480 L 220 615"/>
    <!-- Zero Mile Eastern Link -->
    <path d="M 760 195 L 775 340 L 795 455 L 820 575"/>
  </g>

  <!-- MAJOR HIGHWAY INTERSECTIONS & ROTARIES (YELLOW / BLACK OUTLINE) -->
  <g fill="#facc15" stroke="#0f172a" stroke-width="2.5">
    <circle cx="820" cy="575" r="9"/> <!-- Zero Mile Junction -->
    <circle cx="160" cy="158" r="9"/> <!-- Digha Rotary -->
    <circle cx="220" cy="615" r="9"/> <!-- AIIMS Roundabout -->
    <circle cx="175" cy="320" r="8"/> <!-- Saguna More -->
    <circle cx="520" cy="335" r="8"/> <!-- Dak Bungalow Chauraha -->
    <circle cx="620" cy="185" r="8"/> <!-- Kargil Chowk Gandhi Maidan -->
    <circle cx="420" cy="425" r="8"/> <!-- Mithapur Flyover Junction -->
    <circle cx="720" cy="440" r="8"/> <!-- Kumhrar More -->
    <circle cx="340" cy="600" r="8"/> <!-- Anisabad Golambar -->
  </g>

  <!-- INTERSECTION LABELS -->
  <g font-size="11" font-weight="700" fill="#0f172a">
    <text x="835" y="580">Zero Mile (NH-30 / NH-31)</text>
    <text x="180" y="160">Digha Rotary (Ganga Path)</text>
    <text x="235" y="625">AIIMS Roundabout</text>
    <text x="190" y="325">Saguna More</text>
    <text x="535" y="332">Dak Bungalow</text>
    <text x="635" y="180">Kargil Chowk</text>
    <text x="435" y="420">Mithapur Junction</text>
  </g>

  <!-- ROADSIDE FACILITIES (POINTS OF INTEREST) -->
  <!-- Hospitals (Red Cross/Circle) -->
  <g fill="#dc2626" stroke="#ffffff" stroke-width="1.5">
    <circle cx="210" cy="600" r="7"/> <!-- AIIMS Patna -->
    <circle cx="320" cy="315" r="6"/> <!-- Paras HMRI -->
    <circle cx="430" cy="310" r="6"/> <!-- IGIMS -->
    <circle cx="680" cy="190" r="7"/> <!-- PMCH -->
    <circle cx="810" cy="470" r="6"/> <!-- NMCH -->
    <circle cx="480" cy="330" r="5"/> <!-- Ruban Hospital -->
    <circle cx="280" cy="220" r="5"/> <!-- Kurji Holy Family -->
    <circle cx="510" cy="440" r="5"/> <!-- Mahavir Cancer Sansthan -->
    <circle cx="570" cy="380" r="5"/>
    <circle cx="360" cy="420" r="5"/>
    <circle cx="710" cy="320" r="5"/>
  </g>

  <!-- Fuel Stations (Amber Diamonds) -->
  <g fill="#f59e0b" stroke="#ffffff" stroke-width="1.2">
    <rect x="95" y="598" width="8" height="8" transform="rotate(45 99 602)"/>
    <rect x="295" y="588" width="8" height="8" transform="rotate(45 299 592)"/>
    <rect x="525" y="580" width="8" height="8" transform="rotate(45 529 584)"/>
    <rect x="745" y="568" width="8" height="8" transform="rotate(45 749 572)"/>
    <rect x="145" y="315" width="8" height="8" transform="rotate(45 149 319)"/>
    <rect x="365" y="322" width="8" height="8" transform="rotate(45 369 326)"/>
    <rect x="675" y="332" width="8" height="8" transform="rotate(45 679 336)"/>
  </g>

  <!-- Police Stations (Purple Circles) -->
  <g fill="#7c3aed" stroke="#ffffff" stroke-width="1.2">
    <circle cx="505" cy="355" r="5"/> <!-- Kotwali -->
    <circle cx="395" cy="345" r="5"/> <!-- Shastrinagar -->
    <circle cx="780" cy="545" r="5"/> <!-- Bypass PS -->
    <circle cx="185" cy="345" r="5"/> <!-- Danapur PS -->
  </g>

  <!-- Bus Terminals (Teal Squares) -->
  <g fill="#0d9488" stroke="#ffffff" stroke-width="1.5">
    <rect x="770" y="590" width="10" height="10" rx="2"/> <!-- ISBT Bairiya -->
    <rect x="440" y="435" width="10" height="10" rx="2"/> <!-- Mithapur Bus Stand -->
    <rect x="635" y="195" width="10" height="10" rx="2"/> <!-- Bankipore Stand -->
  </g>

  <!-- TOP HEADER TITLE BLOCK -->
  <g>
    <rect x="35" y="35" width="1130" height="60" fill="#0f172a" rx="4"/>
    <text x="55" y="62" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5px">GIS-BASED HIGHWAY NETWORK &amp; ACCESSIBILITY ANALYSIS</text>
    <text x="55" y="82" font-size="12" font-weight="500" fill="#f59e0b">Study Area: Patna Urban &amp; Peri-Urban Highway Corridor, Bihar (NH-30, Ganga Path, Bailey Road Spine) | B.Tech Civil Engineering Portfolio</text>
    <text x="1145" y="70" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">CRS: WGS 84 / UTM Zone 45N [EPSG:32645]</text>
  </g>

  <!-- RIGHT-HAND CARTOGRAPHIC METADATA & LEGEND PANEL -->
  <g transform="translate(890, 105)" filter="url(#card-shadow)">
    <!-- Legend Container -->
    <rect x="0" y="0" width="275" height="675" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>

    <!-- NORTH ARROW -->
    <g transform="translate(210, 45)">
      <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <polygon points="0,-20 7,2 0,-3 -7,2" fill="#0f172a"/>
      <polygon points="0,-20 -7,2 0,-3" fill="#64748b"/>
      <text x="0" y="-24" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">N</text>
    </g>

    <!-- LEGEND TITLE -->
    <text x="20" y="36" font-size="16" font-weight="800" fill="#0f172a">MAP LEGEND</text>
    <line x1="20" y1="46" x2="160" y2="46" stroke="#d97706" stroke-width="2.5"/>

    <!-- 1. Road Network -->
    <text x="20" y="80" font-size="12" font-weight="700" fill="#334155" text-transform="uppercase">Road Hierarchy (IRC:73)</text>
    <line x1="20" y1="100" x2="55" y2="100" stroke="#d97706" stroke-width="5"/>
    <text x="65" y="104" font-size="11" font-weight="600" fill="#1e293b">National Highway / Expressway</text>

    <line x1="20" y1="125" x2="55" y2="125" stroke="#2563eb" stroke-width="3.5"/>
    <text x="65" y="129" font-size="11" font-weight="600" fill="#1e293b">Primary Arterial Road</text>

    <line x1="20" y1="150" x2="55" y2="150" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="65" y="154" font-size="11" font-weight="600" fill="#1e293b">Secondary Connector Road</text>

    <!-- 2. Roadside Facilities -->
    <text x="20" y="185" font-size="12" font-weight="700" fill="#334155" text-transform="uppercase">Roadside Facilities (POIs)</text>
    <circle cx="28" cy="205" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.2"/>
    <text x="45" y="209" font-size="11" fill="#1e293b">Hospital / Trauma Center</text>

    <rect x="24" y="224" width="8" height="8" transform="rotate(45 28 228)" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2"/>
    <text x="45" y="232" font-size="11" fill="#1e293b">Fuel / Petrol Station</text>

    <rect x="23" y="247" width="10" height="10" rx="2" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/>
    <text x="45" y="256" font-size="11" fill="#1e293b">Bus Terminal / Transit Hub</text>

    <circle cx="28" cy="275" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.2"/>
    <text x="45" y="279" font-size="11" fill="#1e293b">Police Station / Highway Patrol</text>

    <circle cx="28" cy="298" r="7" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
    <text x="45" y="302" font-size="11" font-weight="600" fill="#1e293b">Major Interchange / Rotary</text>

    <!-- 3. Highway Buffers -->
    <text x="20" y="335" font-size="12" font-weight="700" fill="#334155" text-transform="uppercase">Corridor Buffer Bands</text>
    <rect x="20" y="348" width="18" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="46" y="358" font-size="11" fill="#1e293b">500m Buffer (Direct Access)</text>

    <rect x="20" y="370" width="18" height="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="46" y="380" font-size="11" fill="#1e293b">1000m Buffer (Intermediate)</text>

    <rect x="20" y="392" width="18" height="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="46" y="402" font-size="11" fill="#1e293b">2000m Buffer (Secondary)</text>

    <!-- 4. Accessibility Classification -->
    <text x="20" y="435" font-size="12" font-weight="700" fill="#334155" text-transform="uppercase">Accessibility Classification</text>
    <rect x="20" y="448" width="18" height="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="46" y="458" font-size="11" font-weight="600" fill="#15803d">High (45.8% Area)</text>

    <rect x="20" y="470" width="18" height="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="46" y="480" font-size="11" font-weight="600" fill="#b45309">Moderate (35.0% Area)</text>

    <rect x="20" y="492" width="18" height="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="46" y="502" font-size="11" font-weight="600" fill="#b91c1c">Low Deficit (19.2% Area)</text>

    <!-- SCALE BAR -->
    <g transform="translate(20, 545)">
      <text x="0" y="-8" font-size="11" font-weight="700" fill="#334155">METRIC SCALE BAR (1 : 75,000)</text>
      <!-- Alternating blocks -->
      <rect x="0" y="0" width="55" height="7" fill="#0f172a"/>
      <rect x="55" y="0" width="55" height="7" fill="#ffffff" stroke="#0f172a" stroke-width="0.8"/>
      <rect x="110" y="0" width="55" height="7" fill="#0f172a"/>
      <rect x="165" y="0" width="55" height="7" fill="#ffffff" stroke="#0f172a" stroke-width="0.8"/>
      <text x="0" y="20" font-size="9" fill="#475569">0</text>
      <text x="50" y="20" font-size="9" fill="#475569">2.5</text>
      <text x="105" y="20" font-size="9" fill="#475569">5.0</text>
      <text x="160" y="20" font-size="9" fill="#475569">7.5</text>
      <text x="215" y="20" font-size="9" fill="#475569">10.0 km</text>
    </g>

    <!-- PROJECT & CITATION BOX -->
    <g transform="translate(15, 595)">
      <rect x="0" y="0" width="245" height="65" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
      <text x="10" y="16" font-size="10" font-weight="700" fill="#0f172a">B.Tech Civil Engineering Portfolio Project</text>
      <text x="10" y="30" font-size="9" fill="#64748b">Primary GIS: QGIS 3.28 LTR | Python Geodesic</text>
      <text x="10" y="44" font-size="9" fill="#64748b">Source: OpenStreetMap Contributors (ODbL)</text>
      <text x="10" y="56" font-size="9" fill="#b45309">Academic Simulated Attributes: IRC:37/73/82</text>
    </g>
  </g>

</svg>
